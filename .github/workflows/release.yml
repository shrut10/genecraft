name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Python dependencies and test
        run: |
          python -m pip install -r bridge/requirements.txt
          python -m unittest discover -s tests -v
      - name: Build distributable plugin
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Verify release version matches packaged plugin
        run: |
          python - <<'PY'
          import importlib.util, os
          spec = importlib.util.spec_from_file_location('prepare', 'scripts/prepare-demo.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          assert os.environ['GITHUB_REF_NAME'] == 'v' + module.VERSION
          metadata = module.plugin_metadata(module.PLUGIN_JAR)
          assert metadata['name'] == 'GeneCraft'
          assert metadata['version'] == module.VERSION
          PY
      - name: Create GitHub release with plugin JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/genecraft-paper-*.jar --title "GeneCraft $GITHUB_REF_NAME" --generate-notes
