name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies and test
        run: |
          python -m pip install -r bridge/requirements.txt
          python -m unittest discover -s tests -v
      - name: Build distributable plugin
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Create GitHub release with plugin JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/genecraft-paper-0.2.0.jar --title "GeneCraft $GITHUB_REF_NAME" --generate-notes
