name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bridge/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r bridge/requirements.txt
      - name: Compile Python sources
        run: python -m py_compile bridge/genecraft_bridge.py scripts/prepare-demo.py tests/test_bridge.py
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Build Paper plugin
        run: mvn --batch-mode --no-transfer-progress verify
